<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final BOSS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <body class="bg-light">
        <main class="container py-5">
            <section class="text-center mb-5">
                <h1 class="fw-bold">Evaluacion</h1>
            </section>

            <section class="card shadow-sm mb-4">
                <div class="card-header bg-success text-white">
                    <h2 class="h5 mb-0">Agregar Cliente</h2>
                </div>
                <div class="card-body">
                    <form id="frmAggUsusario">
                        <input type="hidden" id="idUsuario">
                        <div class="form-group my-3">
                            <label for="txtNombre" class="form-label">Nombre</label>
                            <input type="text" id="txtNombre" class="form-control" required>

                            <label for="txtApellido" class="form-label">Apellido</label>
                            <input type="text" id="txtApellido" class="form-control" required>

                            <label for="txtCliente" class="form-label">Cliente</label>
                            <input type="text" id="txtCliente" class="form-control" required>

                            <label for="txtEmail" class="form-label">Email</label>
                            <input type="text" id="txtEmail" class="form-control" required>

                            <label for="txtDireccion" class="form-label">Dirección</label>
                            <input type="text" id="txtDireccion" class="form-control" required>
                        </div>
                        <div class="form-group my-3">
                            <button id="btnAggCliente" class="btn btn-success" type="submit">Guardar Cliente</button>
                            <button type="button" id="btnCancelar" class="btn btn-secondary d-none">Cancelar</button>
                        </div>
                    </form>
                </div>
            </section>

            <section class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h2 class="h5 mb-0">Lista de Clientes</h2>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>Nombre</th>
                                    <th>Apellido</th>
                                    <th>Cliente</th>
                                    <th>Email</th>
                                    <th>Dirección</th>
                                </tr>
                            </thead>
                            <tbody id="tblClientes"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script type="module" src="./controller/indexController.js"></script>
    </body>
</body>
</html>
