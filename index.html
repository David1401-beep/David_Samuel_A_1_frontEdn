<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final BOSS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Evaluacion Reservas</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <div class="navbar-nav">
                    <a class="nav-link active" href="index.html">Reservas</a>
                    <a class="nav-link" href="clientes.html">Clientes</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <section class="text-center mb-4">
            <h1 class="fw-bold">Gestion de Reservas</h1>
        </section>

        <div id="alerta" class="d-none" role="alert"></div>

        <section class="card shadow-sm mb-4">
            <div class="card-header bg-success text-white">
                <h2 class="h5 mb-0" id="tituloForm">Nueva Reserva</h2>
            </div>
            <div class="card-body">
                <form id="frmReserva" novalidate>
                    <input type="hidden" id="idReserva">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="cmbCliente" class="form-label">Cliente</label>
                            <select id="cmbCliente" class="form-select">
                                <option value="">Seleccione un cliente</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="cmbVehiculo" class="form-label">Vehiculo</label>
                            <select id="cmbVehiculo" class="form-select">
                                <option value="">Seleccione un vehiculo</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="txtNombreReserva" class="form-label">Nombre de la reserva</label>
                            <input type="text" id="txtNombreReserva" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label for="txtFecha" class="form-label">Fecha de reserva</label>
                            <input type="date" id="txtFecha" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label for="txtPasajeros" class="form-label">Cantidad de pasajeros</label>
                            <input type="number" id="txtPasajeros" class="form-control" min="1">
                        </div>
                        <div class="col-md-6">
                            <label for="txtDias" class="form-label">Cantidad de días</label>
                            <input type="number" id="txtDias" class="form-control" min="1">
                        </div>
                    </div>
                    <div class="my-3">
                        <button id="btnGuardar" class="btn btn-success" type="submit">Guardar Reserva</button>
                        <button type="button" id="btnCancelar" class="btn btn-secondary d-none">Cancelar</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h2 class="h5 mb-0">Historial de Reservas</h2>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Reserva</th>
                                <th>Cliente</th>
                                <th>Vehículo</th>
                                <th>Fecha</th>
                                <th>Pasajeros</th>
                                <th>Días</th>
                                <th>Total</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tblReservas"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="./js/controllers/indexController.js"></script>
</body>
</html>
