<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final BOSS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">AutoRent Express</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <div class="navbar-nav">
                    <a class="nav-link" href="index.html">Reservas</a>
                    <a class="nav-link active" href="clientes.html">Clientes</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <section class="text-center mb-4">
            <h1 class="fw-bold">Gestion de Clientes</h1>
        </section>

        <div id="alerta" class="d-none" role="alert"></div>

        <section class="card shadow-sm mb-4">
            <div class="card-header bg-success text-white">
                <h2 class="h5 mb-0" id="tituloForm">Agregar Cliente</h2>
            </div>
            <div class="card-body">
                <form id="frmCliente" novalidate>
                    <input type="hidden" id="idCliente">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="txtNombre" class="form-label">Nombre</label>
                            <input type="text" id="txtNombre" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label for="txtApellido" class="form-label">Apellido</label>
                            <input type="text" id="txtApellido" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label for="txtTelefono" class="form-label">Telefono</label>
                            <input type="tel" id="txtTelefono" class="form-control" maxlength="8" placeholder="8 dígitos">
                        </div>
                        <div class="col-md-6">
                            <label for="txtEmail" class="form-label">Email</label>
                            <input type="email" id="txtEmail" class="form-control" placeholder="correo@ejemplo.com">
                        </div>
                        <div class="col-12">
                            <label for="txtDireccion" class="form-label">Direcionn</label>
                            <input type="text" id="txtDireccion" class="form-control">
                        </div>
                    </div>
                    <div class="my-3">
                        <button id="btnGuardar" class="btn btn-success" type="submit">Guardar Cliente</button>
                        <button type="button" id="btnCancelar" class="btn btn-secondary d-none">Cancelar</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h2 class="h5 mb-0">Lista de Clientes</h2>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Teléfono</th>
                                <th>Email</th>
                                <th>Dirección</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tblClientes"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="./js/controllers/clientesController.js"></script>
</body>
</html>
